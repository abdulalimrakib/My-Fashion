name: Deploy

# main    -> Vercel production
# staging -> Vercel preview
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time, and never cancel one in flight: migrations
# are applied just before the deploy, so cancelling between those two steps
# would leave the database ahead of the code that is still serving traffic.
# Queuing is the safer failure mode.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      IS_PRODUCTION: ${{ github.ref_name == 'main' }}
      VERCEL_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

    steps:
      # Vercel's own failure for a missing or wrong id is "Could not retrieve
      # Project Settings", which says nothing about which secret is at fault.
      # An unset GitHub secret interpolates to an empty string, so check first.
      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MIGRATION_URL: ${{ github.ref_name == 'main'
            && secrets.PRODUCTION_DIRECT_DATABASE_URL
            || secrets.STAGING_DIRECT_DATABASE_URL }}
          MIGRATION_SECRET_NAME: ${{ github.ref_name == 'main'
            && 'PRODUCTION_DIRECT_DATABASE_URL'
            || 'STAGING_DIRECT_DATABASE_URL' }}
        run: |
          missing=0
          require() {
            if [ -z "$2" ]; then
              echo "::error::Repository secret $1 is not set. See docs/DEPLOYMENT.md."
              missing=1
            fi
          }
          require VERCEL_TOKEN "$VERCEL_TOKEN"
          require VERCEL_ORG_ID "$VERCEL_ORG_ID"
          require VERCEL_PROJECT_ID "$VERCEL_PROJECT_ID"
          require "$MIGRATION_SECRET_NAME" "$MIGRATION_URL"

          # Wrong-shaped ids fail the same opaque way, so catch those too.
          case "$VERCEL_PROJECT_ID" in
            ""|prj_*) ;;
            *) echo "::error::VERCEL_PROJECT_ID should start with 'prj_'. Copy the 'id' field from .vercel/repo.json (or .vercel/project.json)."; missing=1 ;;
          esac
          case "$VERCEL_ORG_ID" in
            ""|team_*|user_*) ;;
            *) echo "::error::VERCEL_ORG_ID should start with 'team_' or 'user_'. Copy the 'orgId' field from .vercel/repo.json (or .vercel/project.json)."; missing=1 ;;
          esac

          [ "$missing" = "0" ] || exit 1
          echo "All required secrets are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Fetches the project settings and environment for the target. Note that
      # `vercel pull` takes --environment, while `vercel deploy` below takes
      # --target; they are different flags on different commands.
      - name: Pull Vercel ${{ env.VERCEL_TARGET }} environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            args="--environment=production"
          else
            args="--environment=preview --git-branch=$GITHUB_REF_NAME"
          fi

          if ! vercel pull --yes $args --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"; then
            echo "::error::vercel pull failed. Usual causes: VERCEL_PROJECT_ID or VERCEL_ORG_ID does not match the Vercel project, or VERCEL_TOKEN is invalid."
            exit 1
          fi

      # Build BEFORE migrating. A failed build is the most common failure here,
      # and it costs nothing if it happens while the database is untouched.
      # Migrating first meant a broken build left the schema ahead of the code
      # that is still serving traffic, with no deployment to go with it.
      #
      # The build needs no database: /sitemap.xml is force-dynamic, so nothing
      # queries Prisma at build time.
      - name: Build
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          else
            vercel build --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Now that there is a build to deploy, move the schema forward. The gap
      # between migrating and deploying is the risky window, so it is kept as
      # small as possible: these two steps are adjacent.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ github.ref_name == 'main'
            && secrets.PRODUCTION_DIRECT_DATABASE_URL
            || secrets.STAGING_DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing migration URL. Set the ${{ github.ref_name == 'main' && 'PRODUCTION_DIRECT_DATABASE_URL' || 'STAGING_DIRECT_DATABASE_URL' }} repository secret (see docs/DEPLOYMENT.md)."
            exit 1
          fi
          npm run db:deploy

      - name: Deploy
        id: deploy
        run: |
          # GitHub runs `run:` steps as `bash -e`, which does NOT include
          # pipefail — so in `vercel deploy ... | tail -n1` the exit status is
          # tail's, and a failed deploy would slip through to be caught only by
          # the URL check below. pipefail makes it fail at the real error.
          set -o pipefail

          # `vercel deploy` takes --target, NOT --environment. (--environment
          # is a `vercel pull` flag.) Passing it here made every preview deploy
          # fail on an unknown option.
          if [ "$IS_PRODUCTION" = "true" ]; then
            url=$(vercel deploy --prebuilt --target=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" | tail -n1)
          else
            url=$(vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" | tail -n1)
          fi

          # Take only the last line: the CLI can print extra output, and an
          # empty or multi-line value would surface later as a confusing curl
          # failure in the smoke test rather than here.
          case "$url" in
            https://*) ;;
            *) echo "::error::vercel deploy did not return a deployment URL."; exit 1 ;;
          esac

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Deployments sit behind Vercel Deployment Protection, which answers an
      # unauthenticated request with a 302 to vercel.com/sso-api before the app
      # is ever reached — so plain `curl` smoke-tests the login page, not the
      # site. `vercel curl` authenticates with the same token used to deploy and
      # handles the protection bypass itself.
      #
      # Turning Deployment Protection off would also make this pass, and would
      # be the wrong trade: it would make every preview publicly readable.
      - name: Smoke test the deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="${{ steps.deploy.outputs.url }}"

          probe() {
            response=$(vercel curl "$url$1" --yes \
              --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" \
              -- --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
            2>&1)
            # Extract the 3-digit status code. `grep -o` returns EVERY match,
            # and the CLI banner shares this output, so `tail -n1` keeps just
            # the last one — otherwise a diagnostic line ending in three digits
            # (a project id, a version) would make $code multi-line and fail
            # every comparison below. `|| echo 000` covers no match at all,
            # e.g. an invalid token.
            echo "$response" | grep -oE '[0-9]{3}$' | tail -n1 || echo "000"
          }

          # A fresh deployment can take a few seconds to become reachable.
          for attempt in 1 2 3 4 5; do
            code=$(probe /) || code=000
            if [ "$code" = "200" ]; then
              echo "Home page returned 200."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Home page returned $code after 5 attempts at $url"
              exit 1
            fi
            echo "Attempt $attempt returned $code; retrying in 10s."
            sleep 10
          done

          # /shop reads from the database, so a 200 here also confirms the
          # deployment's DATABASE_URL works at runtime — which `vercel build`
          # cannot verify, since the value is a Sensitive variable and is only
          # available to the running deployment.
          shop=$(probe /shop)
          echo "/shop returned $shop"
          [ "$shop" = "200" ] || { echo "::error::/shop returned $shop"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### ${{ github.ref_name == 'main' && 'Production' || 'Preview' }} deployment"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
