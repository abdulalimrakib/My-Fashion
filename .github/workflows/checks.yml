name: Checks

# Runs on every pull request, and is called by the deploy workflow so that a
# failing check genuinely blocks a deployment rather than merely reporting
# next to one.
on:
  pull_request:
    branches: [main, staging]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches Vercel's default runtime, so CI and the deployment agree.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both the Prisma client and Next's route types are generated rather than
      # committed, so nothing typechecks until they exist. `prisma generate`
      # only reads prisma/schema.prisma and never opens a connection, so a
      # placeholder URL satisfies prisma.config.ts. Keeping this job free of
      # secrets is deliberate: it lets checks run on pull requests from forks.
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
